
<!DOCTYPE html>
<html>
<head>
    <title>This is Ayushman </title>
    <style>
        body {
            background-color: #0f172a;
            color: orange;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background-color: #1e293b;
            max-width: 500px;
            margin: 30px auto;
            padding: 35px;
            border-radius: 18px;
        }

        h1 {
            color: #60a5fa;
            font-size: 36px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        button {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }
    
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .card {
                padding: 20px;
                margin: 15px auto;
            }

            h1 {
                font-size: 28px;
            }
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #475569;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        form button {
            margin-top: 10px;
        }

        /* Vibrant gradient background */
        body {
            background: radial-gradient(
                circle at top left,
                #312e81,
                #0f172a 65%
            );
            min-height: 100vh;
        }

        /* Glowing card with a smooth entrance */
        .card {
            border: 1px solid rgba(129, 140, 248, 0.35);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            animation: riseIn 0.8s ease-out both;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        /* Card lifts when the mouse hovers over it */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 55px rgba(99, 102, 241, 0.22);
        }

        /* Bright gradient heading */
        h1 {
            background: linear-gradient(
                90deg, #60a5fa, #c084fc, #f0abfc
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Buttons become brighter and lift on hover */
        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(168, 85, 247, 0.4);
        }

        /* Input fields glow when selected */
        input:focus,
        textarea:focus {
            outline: 2px solid #818cf8;
            border-color: #818cf8;
            box-shadow: 0 0 14px rgba(129, 140, 248, 0.25);
        }

        /* Entrance animation */
        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Respect visitors who prefer less animation */
        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
                transition: none;
            }

            button {
                transition: none;
            }
        }

        /* 🌊 OCEAN THEME */
        body {
            background: radial-gradient(
                circle at top left,
                #164e63,
                #082f49 45%,
                #020617 100%
            );
            min-height: 100vh;
        }

        /* Glowing ocean card */
        .card {
            background: rgba(8, 47, 73, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.35);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            animation: riseIn 0.8s ease-out both;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.18);
        }

        /* Cyan gradient heading */
        h1 {
            background: linear-gradient(
                90deg, #67e8f9, #22d3ee, #a5f3fc
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            color: #67e8f9;
        }

        /* Ocean-style buttons */
        button {
            background: linear-gradient(135deg, #0891b2, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
            box-shadow: 0 6px 22px rgba(34, 211, 238, 0.3);
        }

        /* Contact form fields */
        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #155e75;
            border-radius: 8px;
            background: #082f49;
            color: #ecfeff;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #22d3ee;
            border-color: #22d3ee;
            box-shadow: 0 0 14px rgba(34, 211, 238, 0.22);
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            color: #cffafe;
        }

        /* Card entrance animation */
        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile-friendly styling */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
                transition: none;
            }

            button {
                transition: none;
            }
        }
</style>
</head>
<body>

    <div class="card">
        <h1>Hello, Myself Ayushman!</h1>
        <p>I'm learning to build beautiful websites from scratch.</p>
        <p>My goal: create websites that help businesses grow.</p>

<h2>Contact Me</h2>

<form>
    <label for="visitor-name">Your Name:</label>
    <input type="text" id="visitor-name"
           name="name" placeholder="Enter your name">

    <br><br>

    <label for="visitor-email">Your Email:</label>
    <input type="email" id="visitor-email"
           name="email" placeholder="Enter your email">

    <br><br>

    <label for="visitor-message">Your Message:</label>
    <textarea id="visitor-message" name="message"
              placeholder="Write your message"></textarea>

    <br><br>

    <button type="submit">Submit</button>
</form>

        <button onclick="showMessage()">Explore My Journey
<script>
    function showMessage() {
        document.getElementById("message").textContent =
            "Welcome to my website! 🚀";
    }
</script>
</button>

<p id="message"></p>
    </div>

</body>
</html>
